## Copied to /data/kerberos_config.toml on first start (see docs/kerberos.md). The server
## overwrites realm_name, base_dn, ticket_lifetime, renew_lifetime and forwardable at every
## boot from [kerberos_options]; the values are rendered into krb5.conf.
[kerberos]
realm_name = ""
base_dn = ""

ticket_lifetime = "24h"
renew_lifetime = "7d"
forwardable = true
rdns = false
