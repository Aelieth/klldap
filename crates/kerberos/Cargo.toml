[package]
name = "lldap-kerberos"
version = "0.2.1"
description = "MIT Kerberos KDC integration for KLLDAP"
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
minijinja = "2.0"
serde = { workspace = true, features = ["derive"] }
toml = "0.8"
tracing = { workspace = true }

[dependencies.lldap_domain_handlers]
path = "../domain-handlers"

[build-dependencies]
bindgen = { version = "0.69.4", features = ["runtime"] }
pkg-config = "0.3.30"

[[bin]]
name = "kerberos_manager"
path = "src/bin/kerberos_manager.rs"

[dev-dependencies]
pretty_assertions = { workspace = true }
serial_test = { workspace = true }

[dev-dependencies.lldap_test_utils]
path = "../test-utils"
