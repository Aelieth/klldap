## Copied to /data/kerberos_config.toml on first start (see docs/kerberos.md).
## realm_name and base_dn are always taken from the environment
## (LLDAP_KERB_REALM_NAME or the realm derived from LLDAP_LDAP_BASE_DN); the values below
## are rendered into krb5.conf.
[kerberos]
realm_name = ""
base_dn = ""

ticket_lifetime = "24h"
renew_lifetime = "7d"
forwardable = true
rdns = false
