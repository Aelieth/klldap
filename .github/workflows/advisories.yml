name: Advisories

on:
  schedule:
    - cron: "0 15 * * 1"
  push:
    # 0.8.0 is the current development line; drop it when this tree lands on main.
    branches: [ 0.8.0 ]
    tags:
      - "v*"
    paths:
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/advisories.yml'
  workflow_dispatch:

jobs:
  advisories:
    name: make advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories
        run: make advisories
