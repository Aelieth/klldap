[licenses]
version = 2
allow = [
    "GPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/jfbilodeau/yew_form",
    "https://github.com/Aelieth/kerber-rust",
]

[bans]
multiple-versions = "warn"

[advisories]
unsound = "all"
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite: needs a crafted database and -wal pair opened locally; the server opens only its own database; goes with the next sqlx move" },
    { id = "RUSTSEC-2026-0258", reason = "h2: the web listener is a plaintext HTTP/1.x service; HTTP/2 is not offered" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint through opaque-ke's elliptic-curve; moves when opaque-ke does, as upstream" },
    { id = "RUSTSEC-2026-0443", reason = "actix-files: Windows 8.3 short names; KLLDAP ships for Linux only" },
    { id = "RUSTSEC-2024-0421", reason = "idna 0.2.3 is the browser app's validator only; not in the server" },
    { id = "RUSTSEC-2025-0141", reason = "bincode: unmaintained, no upgrade offered; as upstream" },
    { id = "RUSTSEC-2016-0007", reason = "jwt: unmaintained, no upgrade offered; as upstream" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained, build-time only in the browser app; as upstream" },
    { id = "RUSTSEC-2023-0071", reason = "sqlx-mysql's client copy; KLLDAP's own use is on rsa 0.10" },
]
