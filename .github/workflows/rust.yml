name: Rust

on:
  push:
    # 0.8.1 and 0.8.2 are the development lines; drop them when this tree lands on main.
    branches: [ main, 0.8.1, 0.8.2 ]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pre_job:
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@master
        with:
          concurrent_skipping: 'outdated_runs'
          skip_after_successful_duplicate: 'true'
          paths_ignore: '["**/*.md", "docs/**", "example_configs/**", "screenshot.png"]'
          do_not_skip: '["workflow_dispatch", "schedule"]'
          cancel_others: true

  test:
    name: cargo test
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y pkg-config krb5-user
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose --workspace
      - name: Run tests
        run: cargo test --verbose --workspace
      - name: Generate GraphQL schema
        run: cargo run -- export_graphql_schema -o generated_schema.graphql
      - name: Check schema
        run: diff schema.graphql generated_schema.graphql || (echo 'The schema file is out of date. Please run ./export_schema.sh' && false)
      - name: Start scratch Postgres for the migration lane
        run: |
          docker run -d --name lane-postgres -p 127.0.0.1:5433:5432 \
            -e POSTGRES_USER=klldap -e POSTGRES_PASSWORD=klldap -e POSTGRES_DB=klldap \
            postgres:16
          for i in $(seq 1 30); do
            docker exec lane-postgres pg_isready -U klldap -q && break
            sleep 1
          done
      - name: Postgres migration lane
        run: cargo test -p lldap_sql_backend_handler -- --ignored
        env:
          KLLDAP_TEST_DATABASE_URL: postgres://klldap:klldap@127.0.0.1:5433/klldap

  clippy:
    name: cargo clippy
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: No code asks jiff for the system time zone or for a zone by name
        run: |
          grep -rnE --include='*.rs' \
            -e '::(try_)?system\b' \
            -e '\bZoned(DateTime)?::(now|try_from|strptime|from_str)\b' \
            -e 'parse::<(jiff::)?Zoned(DateTime)?>' \
            -e '\bTimeZoneDatabase\b|\btz::db\b|jiff::tz::\{[^}]*\bdb\b' \
            -e '\bTimeZone::get\b|\bin_tz\b' \
            -e '\bparse_(zoned_datetime|time_zone)(_with)?\b' \
            -e '\bto_(zoned_datetime|time_zone)_with\b|\.to_zoned_datetime\(\)' \
            -e '\bTimeZoneAnnotation\b|\bPieces::parse\b|\bfmt::serde::tz\b' \
            crates/ server/ app/ set-password/ migration-tool/ && rc=0 || rc=$?
          [ "$rc" = 1 ] || { echo "::error::jiff is asked for the system time zone or for a zone by name (the lines above), or the search failed"; exit 1; }
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --tests --all -- -D warnings

  alone:
    name: cargo check (each package alone)
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config jq
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check each package without the others' features
        shell: bash
        run: |
          packages="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')"
          failed=""
          for package in $packages; do
            echo "::group::cargo check -p $package"
            cargo check -p "$package" || failed="$failed $package"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::these packages do not build alone:$failed"; exit 1; }

  licenses:
    name: cargo deny
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Check licenses and sources
        run: cargo deny check licenses sources

  format:
    name: cargo fmt
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: Install Rust
        run: rustup show
      - run: cargo fmt --check --all

  shellcheck:
    name: shellcheck
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: Shellcheck boot, release and gate scripts
        run: >
          shellcheck --severity=error
          docker-entrypoint.sh docker-entrypoint-rootless.sh generate_secrets.sh export_schema.sh
          prepare-release.sh app/build.sh scripts/*.sh
          gate/run-gate.sh gate/embed-cell.sh gate/lib/*.sh gate/phases.d/*.sh
