[package]
name = "lldap-kerberos"
version = "0.2.1"
description = "The Kerberos realm KLLDAP runs in-process, on kerber-rust"
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# A login module driven by test files (LLDAP_TEST_ADMISSION_*); never in a release build.
test-admission = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
krb5-admin = { workspace = true }
krb5-config = { workspace = true }
krb5-crypto = { workspace = true }
krb5-kdc = { workspace = true }
krb5-log = { workspace = true }
krb5-protocol = { workspace = true }
krb5-types = { workspace = true }
minijinja = "2.0"
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = "1"

[dependencies.lldap_domain]
path = "../domain"

[dependencies.lldap_domain_handlers]
path = "../domain-handlers"

[dependencies.lldap_opaque_handler]
path = "../opaque-handler"

[dev-dependencies]
krb5-asn1 = { workspace = true }
pretty_assertions = { workspace = true }
sea-orm = { workspace = true }
serial_test = { workspace = true }

[dev-dependencies.lldap_auth]
path = "../auth"

[dev-dependencies.lldap_sql_backend_handler]
path = "../sql-backend-handler"
features = ["test-hooks"]

[dev-dependencies.lldap_test_utils]
path = "../test-utils"
