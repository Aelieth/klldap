name: Rust

on:
  push:
    # 0.7.4 is the current development line; drop it when this tree lands on main.
    branches: [ main, 0.7.4 ]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pre_job:
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@master
        with:
          concurrent_skipping: 'outdated_runs'
          skip_after_successful_duplicate: 'true'
          paths_ignore: '["**/*.md", "docs/**", "example_configs/**", "screenshot.png"]'
          do_not_skip: '["workflow_dispatch", "schedule"]'
          cancel_others: true

  test:
    name: cargo test
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libkrb5-dev clang pkg-config krb5-kdc krb5-admin-server krb5-user
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose --workspace
      - name: Run tests
        run: cargo test --verbose --workspace
      - name: Live-KDC FFI lane
        run: gate/kdc-sandbox.sh cargo test -p lldap-kerberos --verbose -- --ignored --nocapture
      - name: Generate GraphQL schema
        run: cargo run -- export_graphql_schema -o generated_schema.graphql
      - name: Check schema
        run: diff schema.graphql generated_schema.graphql || (echo 'The schema file is out of date. Please run ./export_schema.sh' && false)
      - name: Start scratch Postgres for the migration lane
        run: |
          docker run -d --name lane-postgres -p 127.0.0.1:5433:5432 \
            -e POSTGRES_USER=klldap -e POSTGRES_PASSWORD=klldap -e POSTGRES_DB=klldap \
            postgres:16
          for i in $(seq 1 30); do
            docker exec lane-postgres pg_isready -U klldap -q && break
            sleep 1
          done
      - name: Postgres migration lane
        run: cargo test -p lldap_sql_backend_handler -- --ignored
        env:
          KLLDAP_TEST_DATABASE_URL: postgres://klldap:klldap@127.0.0.1:5433/klldap

  clippy:
    name: cargo clippy
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev clang pkg-config
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --tests --all -- -D warnings

  format:
    name: cargo fmt
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: Install Rust
        run: rustup show
      - run: cargo fmt --check --all

  shellcheck:
    name: shellcheck
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.1
      - name: Shellcheck boot, release and gate scripts
        run: >
          shellcheck --severity=error
          entrypoint.sh start-lldap.sh generate_secrets.sh export_schema.sh
          prepare-release.sh app/build.sh scripts/*.sh
          gate/run-gate.sh gate/kdc-sandbox.sh gate/lib/*.sh gate/phases.d/*.sh
