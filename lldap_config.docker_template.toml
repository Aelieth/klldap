## Default configuration for Docker.
## All the values can be overridden through environment variables, prefixed
## with "LLDAP_". For instance, "ldap_port" can be overridden with the
## "LLDAP_LDAP_PORT" variable.

## Tune the logging to be more verbose by setting this to be true.
## You can set it with the LLDAP_VERBOSE environment variable.
# verbose=false

## The host address that the LDAP server will be bound to.
## To enable IPv6 support, simply switch "ldap_host" to "::":
## To only allow connections from localhost (if you want to restrict to local self-hosted services),
## change it to "127.0.0.1" ("::1" in case of IPv6).
## If LLDAP server is running in docker, set it to "0.0.0.0" ("::" for IPv6) to allow connections
## originating from outside the container.
#ldap_host = "0.0.0.0"

## The port on which to have the LDAP server.
#ldap_port = 3890

## The host address that the HTTP server will be bound to.
## To enable IPv6 support, simply switch "http_host" to "::".
## To only allow connections from localhost (if you want to restrict to local self-hosted services),
## change it to "127.0.0.1" ("::1" in case of IPv6).
## If LLDAP server is running in docker, set it to "0.0.0.0" ("::" for IPv6) to allow connections
## originating from outside the container.
#http_host = "0.0.0.0"

## The port on which to have the HTTP server, for user login and
## administration.
#http_port = 17170

## The public URL of the server, for password reset links. Required when
## smtp_options.enable_password_reset is true: the emailed link is built from it,
## so a loopback value (the default) is unreachable by recipients. Set it to your
## real UI URL, e.g. https://ldap.example.com (env: LLDAP_HTTP_URL).
#http_url = "http://localhost"

## The path to the front-end assets (relative to the working directory).
#assets_path = "./app"

## Random secret for JWT signature.
## This secret should be random, and should be shared with application
## servers that need to consume the JWTs.
## Changing this secret will invalidate all user sessions and require
## them to re-login.
## You should probably set it through the LLDAP_JWT_SECRET environment
## variable from a secret ".env" file.
## This can also be set from a file's contents by specifying the file path
## in the LLDAP_JWT_SECRET_FILE environment variable
## You can generate it with (on linux):
## LC_ALL=C tr -dc 'A-Za-z0-9!#%&'\''()*+,-./:;<=>?@[\]^_{|}~' </dev/urandom | head -c 32; echo ''
#jwt_secret = "REPLACE_WITH_RANDOM"

## Base DN for LDAP.
## This is usually your domain name, and is used as a
## namespace for your users. The choice is arbitrary, but will be needed
## to configure the LDAP integration with other services.
## The sample value is for "example.com", but you can extend it with as
## many "dc" as you want, and you don't actually need to own the domain
## name.
#ldap_base_dn = "dc=example,dc=com"

## Admin username.
## For the LDAP interface, a value of "admin" here will create the LDAP
## user "cn=admin,ou=people,dc=example,dc=com" (with the base DN above).
## For the administration interface, this is the username.
#ldap_user_dn = "admin"

## Admin email.
## Email for the admin account. It is only used when initially creating
## the admin user, and can safely be omitted.
#ldap_user_email = "admin@example.com"

## Admin password.
## Password for the admin account, both for the LDAP bind and for the
## administration interface. It is only used when initially creating
## the admin user.
## It should be minimum 8 characters long.
## You can set it with the LLDAP_LDAP_USER_PASS environment variable.
## This can also be set from a file's contents by specifying the file path
## in the LLDAP_LDAP_USER_PASS_FILE environment variable
## Note: you can create another admin user for user administration, this
## is just the default one.
#ldap_user_pass = "REPLACE_WITH_PASSWORD"

## Force reset of the admin password.
## Break glass in case of emergency: if you lost the admin password, you
## can set this to true to force a reset of the admin password to the value
## of ldap_user_pass above.
## Alternatively, you can set it to "always" to reset every time the server starts.
# force_ldap_user_pass_reset = false

## Accept a private key (key_file / key_seed) that differs from the one the database
## was created with. Every stored password becomes unusable; combine with
## force_ldap_user_pass_reset and have users reset their passwords. Env variable:
## LLDAP_FORCE_UPDATE_PRIVATE_KEY
# force_update_private_key = false

## Second factor (TOTP). false = off (default); true = users who enrolled an
## authenticator append their code to the password (yourpassword:123456); "always" =
## every user must enroll. Members of the lldap_mfa_disabled group are exempt.
## Env variable: LLDAP_ENABLE_MFA
# enable_mfa = false

## Database URL.
## This encodes the type of database (SQlite, MySQL, or PostgreSQL)
## , the path, the user, password, and sometimes the mode (when
## relevant).
## Note: SQlite should come with "?mode=rwc" to create the DB
## if not present.
## Example URLs:
##  - "postgres://postgres-user:password@postgres-server/my-database"
##  - "mysql://mysql-user:password@mysql-server/my-database"
##
## This can be overridden with the LLDAP_DATABASE_URL env variable.
database_url = "sqlite:////data/users.db?mode=rwc"

## Private key file.
## Not recommended, use key_seed instead.
## Contains the secret private key used to store the passwords safely.
## Note that even with a database dump and the private key, an attacker
## would still have to perform an (expensive) brute force attack to find
## each password.
## Randomly generated on first run if it doesn't exist. The default is
## "server_key" relative to the working directory (/app in the image, which is
## not persisted): in Docker, use a path under /data.
## Env variable: LLDAP_KEY_FILE
#key_file = "/data/server_key"

## Seed to generate the server private key, see key_file above.
## This can be any random string, the recommendation is that it's at least 12
## characters long.
## Env variable: LLDAP_KEY_SEED
key_seed = "RanD0m STR1ng"

## Ignored attributes.
## Some services (e.g. SSSD enumeration) request attributes KLLDAP doesn't model. Common ones
## (shadow*, authorizedService, host, rhost, userPassword) are recognized as built-in no-ops and
## never logged. Anything else is quietly dropped and logged only at debug level; add such names
## here to suppress that debug line too.
#ignored_user_attributes = [ "sAMAccountName" ]
#ignored_group_attributes = [ "mail", "userPrincipalName" ]

## Options to configure SMTP parameters, to send password reset emails.
## To set these options from environment variables, use the following format
## (example with "password"): LLDAP_SMTP_OPTIONS__PASSWORD
[smtp_options]
## Whether to enabled password reset via email, from LLDAP.
#enable_password_reset=true
## The SMTP server.
#server="smtp.gmail.com"
## The SMTP port.
#port=587
## How the connection is encrypted, either "NONE" (no encryption), "TLS" or "STARTTLS".
#smtp_encryption = "TLS"
## The SMTP user, usually your email address.
#user="sender@gmail.com"
## The SMTP password.
#password="password"
## The header field, optional: how the sender appears in the email. The first
## is a free-form name, followed by an email between <>.
#from="LLDAP Admin <sender@gmail.com>"
## Same for reply-to, optional.
#reply_to="Do not reply <noreply@localhost>"

## Options to configure LDAPS.
## To set these options from environment variables, use the following format
## (example with "port"): LLDAP_LDAPS_OPTIONS__PORT
[ldaps_options]
## Whether to enable LDAPS.
#enabled=true
## Port on which to listen.
#port=6360
## Certificate file.
#cert_file="/data/cert.pem"
## Certificate key file.
#key_file="/data/key.pem"

## Options to configure the healthcheck command.
## To set these options from environment variables, use the following format
## (example with http_host): LLDAP_HEALTHCHECK_OPTIONS__HTTP_HOST
[healthcheck_options]
## The host address that the healthcheck should verify for the HTTP server.
## If "http_host" is set to a specific IP address, this must be set to match if the built-in
## healthcheck command is used.  Note: if this is an IPv6 address, it must be wrapped in [].
#http_host = "localhost"
## The host address that the healthcheck should verify for the LDAP server.
## If "ldap_host" is set to a specific IP address, this must be set to match if the built-in
## healthcheck command is used.
#ldap_host = "localhost"

## Options for the Kerberos realm that runs beside the directory.
## To set these options from environment variables, use the following format
## (example with realm): LLDAP_KERBEROS_OPTIONS__REALM
[kerberos_options]
## Run Kerberos with the directory: directory writes wait for the KDC after boot, users with
## kerberossync get principals, and the healthcheck also requires the KDC and the admin
## keytab. Set false to run without a realm.
#enabled = true
## The realm. Defaults to the domain of ldap_base_dn, uppercased (dc=example,dc=com gives
## EXAMPLE.COM).
#realm = "EXAMPLE.COM"
## Ticket lifetimes, as Kerberos durations ("24h", "7d", "36000s"). A bare
## number is refused, and zero is refused.
#ticket_lifetime = "24h"
#renew_lifetime = "7d"
## Issue forwardable tickets.
#forwardable = true
## Session and long-term keys. Accepts aes256-cts-hmac-sha1-96,
## aes128-cts-hmac-sha1-96, aes256-cts-hmac-sha384-192 and
## aes128-cts-hmac-sha256-128. 3DES and RC4 are refused as deprecated
## (RFC 8429). Camellia is refused because the embedded KDC does not serve it.
## One type name per item: family names such as "aes" or "default", +/- prefixes and two
## names in one item are refused. A new first type rolls krbtgt's key at the next boot.
#supported_enctypes = ["aes256-cts-hmac-sha1-96"]
## KDC listen address and port (UDP and TCP). Publish 1088 as 88.
#kdc_host = "0.0.0.0"
#kdc_port = 1088
## kadmin listen address and port, on the container's loopback. Use it with docker exec.
#kadmin_host = "127.0.0.1"
#kadmin_port = 1749
## Extra kadmin ACL lines. admin/admin@REALM * is always granted.
#kadmin_acl = "/data/kadm5.acl"
## The image sets these paths by ENV too; the code's defaults are relative to the working
## directory.
## Database and stash. The directory itself is mode 0700.
data_dir = "/var/kerberos/krb5kdc"
## Admin keytab, rewritten every boot at mode 0600.
admin_keytab = "/data/kadm5.keytab"
## Client krb5.conf written at every boot, for tools inside the container.
client_config = "/data/krb5.conf"

## Options to configure the event log.
## To set these options from environment variables, use the following format
## (example with retention_days): LLDAP_LOG_OPTIONS__RETENTION_DAYS
[log_options]
## Persist events (logins, binds, directory changes, denials) to the database.
## The terminal lines are printed either way; the two limits below still apply.
#persist = true
## Delete events older than this many days (a longer history: 90). 0 keeps them forever.
#retention_days = 30
## Keep at most this many events, oldest first (a longer history: 100000). 0 means unlimited.
#max_entries = 50000
## Store one successful bind per user, protocol and address within this many seconds, so
## service accounts that bind constantly do not fill max_entries. 0 stores every bind.
#bind_coalesce_seconds = 300

## Options for the Keycloak federation tab.
## To set these options from environment variables, use the following format
## (example with admin_pass): LLDAP_KEYCLOAK_OPTIONS__ADMIN_PASS
## A secret may also be read from a file: LLDAP_KEYCLOAK_OPTIONS__ADMIN_PASS_FILE
## If both are set, the plain value wins.
[keycloak_options]
## Where the Federation tab stores the URL, realm and admin user.
config_file = "/data/keycloak_config.toml"
## Keycloak HTTP keytab, written by Export keytab.
keytab = "/data/keytab/keycloak-http.keytab"
## Keycloak admin password. No default. Not written into the file above.
#admin_pass = "changeme"
