[package]
name = "lldap_domain_handlers"
version = "0.1.1"
description = "Backend handler traits for KLLDAP"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# A test hook that aborts a password change at a named step; never in a release build.
kill-points = []
# A test hook that pauses a password change after its door's read of the switch.
test-hooks = []
# A thread's own Kerberos backend, set by test-utils' guards so a test's backend never reaches
# another test running in parallel; only test-utils turns it on, and it is a dev-dependency.
test-backend-scope = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
ldap3_proto = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dependencies.lldap_auth]
path = "../auth"
features = ["opaque_server", "opaque_client", "sea_orm"]

[dependencies.lldap_domain]
path = "../domain"

[dependencies.lldap_domain_model]
path = "../domain-model"

[dependencies.lldap_opaque_handler]
path = "../opaque-handler"

[dependencies.lldap_schema]
path = "../schema"

[dependencies.serde]
workspace = true

[dev-dependencies]
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
