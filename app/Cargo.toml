[package]
name = "lldap_app"
version.workspace = true
description = "Front-end for KLLDAP"
edition.workspace = true
include = ["src/**/*", "queries/**/*", "Cargo.toml", "../schema.graphql"]
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
derive_more = { workspace = true }
gloo-console = "0.4"
gloo-file = "0.4"
gloo-net = "0.7"
gloo-timers = "0.3"
graphql_client = { workspace = true }
jwt = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = { workspace = true }
rsa = "0.9.6"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
strum = { workspace = true }
url-escape = "0.1.1"
validator = "0.14"
validator_derive = "0.14"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0"
yew = "0.19.3"
yew-router = "0.16"

# opaque_server stays enabled (default): the shared login/registration wire types
# in lldap_auth reference opaque::server types even on the client side.
[dependencies.lldap_auth]
path = "../crates/auth"
features = [ "opaque_client" ]

[dependencies.lldap_frontend_options]
path = "../crates/frontend-options"

[dependencies.lldap_mfa]
path = "../crates/mfa"
default-features = false

[dependencies.lldap_validation]
path = "../crates/validation"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Element",
  "Event",
  "FileList",
  "FocusEvent",
  "FormData",
  "HtmlDocument",
  "HtmlFormElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "InputEvent",
  "MouseEvent",
  "RequestCredentials",
  "Window",
]

[dependencies.yew_form]
git = "https://github.com/jfbilodeau/yew_form"
rev = "4b9fabffb63393ec7626a4477fd36de12a07fac9"

[dependencies.yew_form_derive]
git = "https://github.com/jfbilodeau/yew_form"
rev = "4b9fabffb63393ec7626a4477fd36de12a07fac9"

[lib]
crate-type = ["cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(wasm_bindgen_unstable_test_coverage)',
] }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = ['--enable-bulk-memory']
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ['--enable-bulk-memory']
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['--enable-bulk-memory']
